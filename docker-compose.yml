services:
  web:
    build: .
    image: lightstorm-itpmo:latest
    container_name: lightstorm-itpmo
    ports:
      - "${HOST_PORT:-80}:8000"
    env_file:
      - .env
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      # SQLite database — persisted across container restarts / upgrades
      - db_data:/app/instance
      # User-uploaded attachments
      - uploads:/app/static/uploads
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  uploads:
