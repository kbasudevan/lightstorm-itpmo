{% extends "base.html" %}
{% block title %}Sign In — ITPMO{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center" style="background:linear-gradient(135deg,#0F172A,#1E3A5F)">
  <div class="container" style="max-width:420px">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/lightstorm-logo-white.webp') }}"
           alt="Lightstorm" height="40"
           style="mix-blend-mode:screen;object-fit:contain">
      <div class="mt-3">
        <h2 class="text-white fw-bold mb-0">ITPMO</h2>
        <p class="text-secondary small mb-0">IT Project Management Office</p>
      </div>
    </div>

    <div class="ls-card p-4">
      <h5 class="fw-bold mb-1">Sign In</h5>
      <p class="text-muted small mb-4">Access your project dashboard</p>

      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@company.com" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Security Check
            <span class="text-muted small fw-normal">— What is {{ captcha_a }} + {{ captcha_b }}?</span>
          </label>
          <input type="number" name="captcha" class="form-control" placeholder="Enter the answer" required autofocus>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" name="remember" id="remember">
          <label class="form-check-label small" for="remember">Keep me signed in</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <hr class="my-4">
      <p class="text-center text-muted small mb-0">
        Don't have an account?
        <a href="{{ url_for('register') }}" class="fw-semibold">Request Access</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
