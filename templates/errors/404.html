{% extends "base.html" %}
{% block title %}404 Not Found — ITPMO{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center text-center px-4">
  <div>
    <div style="font-size:5rem;opacity:.2" class="mb-3"><i class="bi bi-search"></i></div>
    <h1 class="display-4 fw-bold">404</h1>
    <h4 class="fw-semibold mb-3">Page Not Found</h4>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Go Home</a>
  </div>
</div>
{% endblock %}
